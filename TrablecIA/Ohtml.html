<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A barbearia do seu Zéca</title>
    <link rel="stylesheet" href="Ohtml.css">
</head>
<body>
<div class="container">
    <h1> Barbearia do seu Zéca</h1>
    
    <form id="agendamentoForm" onsubmit="confirmarAgendamento(event)">

        <div class="section">
            <h2>1. Seus Dados (Cadastro)</h2>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Coloca seu Nome">
            
            <label for="telefone">Telefone / WhatsApp:</label>
            <input type="tel" id="telefone" required placeholder="Ex: (41) 99999-9999">
        </div>

        <div class="section">
            <h2>2. Escolha os Serviços</h2>
            
            <div class="service-option">
                <label><input type="checkbox" name="servico" value="35" onchange="calcularTotal()"> Corte de Cabelo</label>
                <span>R$ 35,00</span>
            </div>
            
            <div class="service-option">
                <label><input type="checkbox" name="servico" value="25" onchange="calcularTotal()"> Fazer a Barba</label>
                <span>R$ 25,00</span>
            </div>
            
            <div class="service-option">
                <label><input type="checkbox" name="servico" value="50" onchange="calcularTotal()"> Combo (Corte + Barba)</label>
                <span>R$ 50,00</span>
            </div>
        </div>

        <div class="section">
            <h2>3. Data e Horário</h2>
            <label for="data">Escolha o Dia:</label>
            <input type="date" id="data" required>
            
            <label for="hora">Escolha a Hora:</label>
            <input type="time" id="hora" required>
        </div>

        <div class="section">
            <h2>4. Forma de Pagamento</h2>
            <label for="pagamento">Como deseja pagar no local?</label>
            <select id="pagamento" required>
                <option value="">Selecione uma opção...</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Pix">Pix</option>
                <option value="Cartão de Crédito">Cartão de Crédito</option>
                <option value="Cartão de Débito">Cartão de Débito</option>
            </select>
            
            <div class="total-box">
                Total do Agendamento: R$ <span id="valorTotal">0,00</span>
            </div>
        </div>

        <button type="submit">Concluir Agendamento</button>
    </form>
</div>

<script>
    function calcularTotal() {
        const checkboxes = document.querySelectorAll('input[name="servico"]');
        let total = 0;
        
        checkboxes.forEach(checkbox => {
            if (checkbox.checked) {
                total += parseFloat(checkbox.value);
            }
        });
        
        document.getElementById('valorTotal').innerText = total.toFixed(2).replace('.', ',');
    }

    function confirmarAgendamento(event) {
        event.preventDefault();
        const nome = document.getElementById('nome').value;
        const telefone = document.getElementById('telefone').value;
        const data = document.getElementById('data').value;
        const hora = document.getElementById('hora').value;
        const pagamento = document.getElementById('pagamento').value;
        const total = document.getElementById('valorTotal').innerText;
        
        if (total === "0,00") {
            alert("Por favor, selecione pelo menos um serviço!");
            return;
        }

        const dataFormatada = data.split('-').reverse().join('/');

        alert(`Agendamento realizado com sucesso!\n\nCliente: ${nome}\nTelefone: ${telefone}\nData: ${dataFormatada} às ${hora}\nForma de Pagamento: ${pagamento}\nValor Total: R$ ${total}\n\nObrigado pela preferência!`);

        document.getElementById('agendamentoForm').reset();
        document.getElementById('valorTotal').innerText = "0,00";
    }
</script>
    </div>
    </center>
</body>
</html>
